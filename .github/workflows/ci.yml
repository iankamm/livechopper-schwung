name: CI

# Fork-safe: pull_request (never pull_request_target), read-only token, no
# secrets. Mirrors Schwung's CI split: host tests, then the ARM64 build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Against Schwung's min_host_version and its newest release, so a
    # framework change that breaks the module shows up when it ships.
    name: tests (schwung ${{ matrix.schwung }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schwung: [v1.7.3, latest]
    steps:
      # tests/ui_smoke.mjs reads ../schwung (shared JS, a Move set fixture)
      # and ../schwung-waveform-editor (reference preset), so check all three
      # out side by side.
      - uses: actions/checkout@v4
        with:
          path: livechopper

      - name: Resolve the Schwung ref
        id: ref
        run: |
          set -eo pipefail
          REF="${{ matrix.schwung }}"
          if [ "$REF" = latest ]; then
            REF=$(git ls-remote --tags --refs https://github.com/charlesvestal/schwung.git \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          else
            # The pinned entry must stay the declared minimum.
            MIN="v$(jq -r .min_host_version livechopper/src/module.json)"
            [ "$REF" = "$MIN" ] || { echo "matrix has $REF but min_host_version is $MIN"; exit 1; }
          fi
          echo "Schwung $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung
          ref: ${{ steps.ref.outputs.ref }}
          path: schwung

      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung-waveform-editor
          path: schwung-waveform-editor

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host tests (DSP with ASan/UBSan, UI smoke test)
        working-directory: livechopper
        run: ./scripts/test.sh

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Docker (same as release.yml)
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      - name: Check artifacts
        run: |
          set -e
          ID=$(jq -r .id src/module.json)
          file "dist/$ID/dsp.so" | tee /dev/stderr | grep -q 'ARM aarch64'
          for f in module.json ui.js drum_rack.mjs dsp.so help.json; do
            tar tzf "dist/$ID-module.tar.gz" | grep -qx "$ID/$f" || { echo "missing $ID/$f"; exit 1; }
          done
          echo "Artifacts OK"
